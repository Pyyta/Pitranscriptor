name: Desktop package smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/build_desktop.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-package.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.10'
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libopengl0 libpulse0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxrender1 libxi6 libsm6 libice6 libfontconfig1 \
            xvfb xauth weston fonts-dejavu-core
      - run: uv sync --locked --all-extras --group package
      - run: uv run --frozen --all-extras --group package python scripts/build_desktop.py
      - name: Install and start on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'dist/desktop/Pitranscriptor-Setup.exe'
          $target = Join-Path $env:RUNNER_TEMP 'Pitranscriptor smoke'
          $arguments = '--target "{0}"' -f $target
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $application = Join-Path $target 'Pitranscriptor.exe'
          $process = Start-Process -FilePath $application -ArgumentList '--self-test' -Wait -PassThru
          exit $process.ExitCode
      - name: Install and start on Linux
        if: runner.os == 'Linux'
        run: |
          stage=$(mktemp -d)
          tar -xzf dist/desktop/Pitranscriptor-linux-x86_64.tar.gz -C "$stage"
          sh "$stage/install-linux.sh" "$RUNNER_TEMP/Pitranscriptor smoke"
          "$RUNNER_TEMP/Pitranscriptor smoke/Pitranscriptor" --self-test
      - name: Start on X11 and Wayland
        if: runner.os == 'Linux'
        run: |
          app="$RUNNER_TEMP/Pitranscriptor smoke/Pitranscriptor"
          QT_QPA_PLATFORM=xcb xvfb-run -a "$app" --self-test
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless-backend.so --socket=pitranscriptor-ci > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if test -S "$XDG_RUNTIME_DIR/pitranscriptor-ci"; then break; fi
            sleep 1
          done
          if ! test -S "$XDG_RUNTIME_DIR/pitranscriptor-ci"; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=pitranscriptor-ci "$app" --self-test
